name: Deploy lên Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Secret này được tạo bởi lệnh: npx firebase-tools init hosting:github
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COONG_59EDE }}
          projectId: coong-59ede
          channelId: live
      # Đưa quy tắc bảo mật Firestore (firestore.rules) lên cùng lúc.
      # Dùng chung service account ở trên, cần có quyền "Firebase Rules Admin".
      - name: Deploy Firestore rules
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COONG_59EDE }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json" npx firebase-tools deploy --only firestore:rules --project coong-59ede
          rm -f "$RUNNER_TEMP/firebase-key.json"
