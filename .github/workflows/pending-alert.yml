name: Nhắc đơn chờ xác nhận

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ in ra, không gửi tin (1 = chạy thử)'
        default: '0'

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save firebase-admin
      - name: Nhắc đơn chờ quá 10 phút
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COONG_59EDE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json" node scripts/pending-alert.mjs
          rm -f "$RUNNER_TEMP/firebase-key.json"
